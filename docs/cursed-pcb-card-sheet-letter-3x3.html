<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cursed PCB — Nine-card Letter Sheet</title>
  <link rel="stylesheet" href="cursed-pcb-card.css">
  <style>
    @page { size: Letter portrait; margin: 0; }

    html, body {
      width: 215.9mm;
      height: 279.4mm;
      overflow: hidden;
    }

    .sheet {
      display: grid;
      grid-template-columns: repeat(3, 70mm);
      grid-template-rows: repeat(3, 90mm);
      width: 210mm;
      height: 270mm;
      margin: 4.7mm auto 0;
    }

    .sheet cursed-card {
      outline: .18mm dashed #8b8d8a;
      outline-offset: -.18mm;
    }
  </style>
</head>
<body>
  <main class="sheet" aria-label="Nine Cursed PCB setup cards">
    <cursed-card></cursed-card>
    <cursed-card></cursed-card>
    <cursed-card></cursed-card>
    <cursed-card></cursed-card>
    <cursed-card></cursed-card>
    <cursed-card></cursed-card>
    <cursed-card></cursed-card>
    <cursed-card></cursed-card>
    <cursed-card></cursed-card>
  </main>
  <script src="cursed-pcb-card.js"></script>
</body>
</html>
