<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cursed PCB — Nine-card Letter Sheet</title>
  <link rel="stylesheet" href="cursed-pcb-card.css">
  <style>
    @page { size: Letter portrait; margin: 0; }

    html, body {
      width: 215.9mm;
      height: 279.4mm;
      overflow: hidden;
    }

    .sheet {
      display: grid;
      grid-template-columns: repeat(3, 70mm);
      grid-template-rows: repeat(3, 90mm);
      width: 210mm;
      height: 270mm;
      margin: 4.7mm auto 0;
    }

    .sheet cursed-card {
      position: relative;
    }

    .sheet cursed-card::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(#8b8d8a, #8b8d8a) left top / 3mm .18mm no-repeat,
        linear-gradient(#8b8d8a, #8b8d8a) left top / .18mm 3mm no-repeat,
        linear-gradient(#8b8d8a, #8b8d8a) right top / 3mm .18mm no-repeat,
        linear-gradient(#8b8d8a, #8b8d8a) right top / .18mm 3mm no-repeat,
        linear-gradient(#8b8d8a, #8b8d8a) left bottom / 3mm .18mm no-repeat,
        linear-gradient(#8b8d8a, #8b8d8a) left bottom / .18mm 3mm no-repeat,
        linear-gradient(#8b8d8a, #8b8d8a) right bottom / 3mm .18mm no-repeat,
        linear-gradient(#8b8d8a, #8b8d8a) right bottom / .18mm 3mm no-repeat;
    }
  </style>
</head>
<body>
  <main class="sheet" aria-label="Nine Cursed PCB setup cards">
    <cursed-card></cursed-card>
    <cursed-card></cursed-card>
    <cursed-card></cursed-card>
    <cursed-card></cursed-card>
    <cursed-card></cursed-card>
    <cursed-card></cursed-card>
    <cursed-card></cursed-card>
    <cursed-card></cursed-card>
    <cursed-card></cursed-card>
  </main>
  <script src="cursed-pcb-card.js"></script>
</body>
</html>
